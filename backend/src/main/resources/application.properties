server.port=8080
spring.application.name=traffic-supervision-backend

# PostgreSQL Connection
spring.datasource.url=jdbc:postgresql://localhost:5432/traffic_supervision
spring.datasource.username=postgres
spring.datasource.password=2003
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# FastAPI Simulation Service Configuration
fastapi.base-url=http://localhost:8000
fastapi.ws-url=ws://localhost:8000/ws/metrics

# Default Simulation Paths (Casablanca)
simulation.default.net=C:/Users/lamda/Downloads/traffic-supervision/simulation/network/casa.net.xml
simulation.default.routes=C:/Users/lamda/Downloads/traffic-supervision/simulation/network/routes_casa2.rou.xml
